# Déploiement production : S3 (RustFS) + PostgreSQL + application planifiée.
# Variables lues dans le fichier .env (voir deploy/.env.example).
services:
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-9000}:9000"   # accessible uniquement depuis la VM (port hôte configurable)
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-pipeline}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-pipeline-app:latest}
    build: .
    restart: unless-stopped
    depends_on:
      rustfs:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-transactions}
      S3_AUTOSTART: "0"          # le S3 est un autre conteneur : ne pas lancer docker compose
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pipeline}
      SCHEDULE_MINUTES: ${SCHEDULE_MINUTES:-5}
    command: ["--planifie"]       # exécution initiale puis cycle toutes les SCHEDULE_MINUTES minutes

volumes:
  rustfs-data:
  pg-data:
